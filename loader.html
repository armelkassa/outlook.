<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="8; url=./pdf.html">
    <title>loading</title>
    <link href="https://fonts.googleapis.com/css2?family=Actief+Grotesque:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        body { margin: 0; padding: 0; height: 100vh; width: 100%; display: flex; justify-content: center; align-items: center; background-color: #F4F5F7; font-family: 'Inter', sans-serif; overflow: hidden; }
        .loader-container { display: flex; flex-direction: column; align-items: center; gap: 24px; text-align: center; }
        .spinner { width: 48px; height: 48px; border: 4px solid rgba(64, 159, 255, 0.2); border-radius: 50%; border-top-color: #409FFF; animation: spin 1s cubic-bezier(0.55, 0.055, 0.675, 0.19) infinite; }
        .status-text { color: #171717; font-weight: 500; font-size: 1.1rem; animation: pulse 2s infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
    </style>
</head>
<body>
    <div class="loader-container">
        <div class="spinner"></div>
        <div class="status-text">Finalisation du téléchargement...</div>
    </div>
</body>
</html>
